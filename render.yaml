services:
  - type: web
    name: nightforge-v1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash setup_ffmpeg.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
